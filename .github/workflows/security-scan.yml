name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 每天凌晨 2 点运行 (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  gosec:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GoSec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload GoSec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: gosec-results.sarif

      - name: Upload GoSec results as artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: gosec-results
          path: gosec-results.sarif

  govulncheck:
    name: GoVulnCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoVulnCheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: govulncheck-results
          path: |
            govulncheck-results.txt
            vuln-report.json

  golangci-lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout 5m --verbose

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: golangci-lint-results
          path: |
            golangci-lint-report.json
            golangci-lint-report.html

  security-scan-script:
    name: Security Scan Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install security tools
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run security scan script
        run: |
          chmod +x scripts/security-scan.sh
          ./scripts/security-scan.sh || true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: |
            gosec-report.json
            security-scan-results.txt

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # 只在有 SONAR_TOKEN 时运行
    if: vars.SONAR_TOKEN != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests with coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ai-gateway
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/bin/**,**/frontend/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.coverage.exclusions=**/*_test.go,**/vendor/**
            -Dsonar.go.coverage.reportPaths=coverage.out

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [gosec, govulncheck, golangci-lint, security-scan-script]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- GoSec: ${{ needs.gosec.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GoVulnCheck: ${{ needs.govulncheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GolangCI-Lint: ${{ needs.golangci-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Script: ${{ needs.security-scan-script.result }}" >> $GITHUB_STEP_SUMMARY
