# SonarQube 配置文件

# 项目标识
sonar.projectKey=ai-gateway
sonar.organization=ai-gateway

# 源代码配置
sonar.sources=.
sonar.sourceEncoding=UTF-8

# 排除的文件和目录
sonar.exclusions=**/*_test.go,**/vendor/**,**/bin/**,**/frontend/**,**/scripts/**,**/.planning/**,**/*.md
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# 覆盖率配置
sonar.coverage.exclusions=**/*_test.go,**/vendor/**,**/frontend/**,**/scripts/**
sonar.go.coverage.reportPaths=coverage.out

# 代码质量配置
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Go 特定配置
sonar.go.tests.reportPaths=report.json
sonar.go.goroutine.reportPaths=goroutine-report.json

# 排除规则
sonar.issue.ignore.multicriteria=e1,e2,e3

# e1: 排除测试文件中的某些检查
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# e2: 排除生成的代码
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/generated/**

# e3: 排除示例代码
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/examples/**

# 语言设置
sonar.language=go
