server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ai-gateway-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ai-gateway
          environment: development
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            time: timestamp
            request_id: request_id
            user_id: user_id
      - labels:
          level:
          request_id:
          user_id:
