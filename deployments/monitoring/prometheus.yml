global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-gateway'
    environment: 'development'

# 告警规则文件
rule_files:
  - 'alerts.yml'

# 抓取配置
scrape_configs:
  # API Gateway
  - job_name: 'ai-gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api-gateway'
    metrics_path: '/metrics'

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# 告警管理器（可选）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
