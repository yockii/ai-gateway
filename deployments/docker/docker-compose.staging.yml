# AI Gateway Staging Environment Configuration
# Extends base configuration with staging-specific overrides

version: '3.8'

services:
  # Override ai-gateway for staging
  ai-gateway:
    image: ${DOCKER_REGISTRY:-ai-gateway}:${IMAGE_TAG:-staging}
    container_name: ai-gateway-app-staging
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      ENABLE_METRICS: "true"
    ports:
      - "8080:8080"
      - "9090:9090"
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Nginx reverse proxy for staging
  nginx:
    image: nginx:alpine
    container_name: ai-gateway-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/nginx-staging.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/certs:/etc/nginx/certs:ro
      - nginx_logs_staging:/var/log/nginx
    depends_on:
      - ai-gateway
    networks:
      - ai-gateway-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  nginx_logs_staging:
    driver: local
