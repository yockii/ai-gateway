# AI Gateway 完整开发环境
# 包含后端 API、数据库、缓存、监控服务

version: '3.8'

services:
  # ==================== 核心服务 ====================

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ai-gateway-postgres
    environment:
      POSTGRES_DB: ai_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-gateway-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-gateway-network

  # AI Gateway 后端服务
  ai-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: ai-gateway:dev
    container_name: ai-gateway-app
    environment:
      # 日志配置
      LOG_LEVEL: debug
      LOG_FORMAT: json
      ENABLE_METRICS: "true"
      ENV: development

      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ai_gateway

      # Redis 配置
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""

      # 服务器配置
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080

    ports:
      - "8080:8080"    # API 端口
      - "9090:9090"    # Metrics 端口
      - "2345:2345"    # Debug 端口

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      - ai-gateway-network
      - monitoring-network
    restart: unless-stopped

  # ==================== 前端服务 ====================

  # 用户端前端
  user-frontend:
    build:
      context: ../../frontend/user
      dockerfile: Dockerfile
    container_name: ai-gateway-user-frontend
    ports:
      - "5173:80"
    depends_on:
      - ai-gateway
    networks:
      - ai-gateway-network
    restart: unless-stopped

  # 运维端前端
  admin-frontend:
    build:
      context: ../../frontend/admin
      dockerfile: Dockerfile
    container_name: ai-gateway-admin-frontend
    ports:
      - "5174:80"
    depends_on:
      - ai-gateway
    networks:
      - ai-gateway-network
    restart: unless-stopped

  # ==================== 监控服务 ====================

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-gateway-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ../../deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ai-gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ../../deployments/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ==================== 网络配置 ====================

networks:
  ai-gateway-network:
    driver: bridge
  monitoring-network:
    driver: bridge

# ==================== 数据卷 ====================

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
