# AI Gateway Development Environment Configuration
# Extends base configuration with development-specific overrides

version: '3.8'

services:
  # Override ai-gateway for development
  ai-gateway:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: ai-gateway:dev
    container_name: ai-gateway-app-dev
    environment:
      LOG_LEVEL: debug
      LOG_FORMAT: text
      ENABLE_METRICS: "true"
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ai_gateway
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "8080:8080"    # API port
      - "2345:2345"    # Delve debug port
    volumes:
      # Mount data directory for persistence
      - ../../data:/app/data
    restart: unless-stopped
    # Remove resource limits for development
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL with development overrides
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      # Mount init scripts for development
      - ../../database/init:/docker-entrypoint-initdb.d

  # Redis with development overrides
  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
